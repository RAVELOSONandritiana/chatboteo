<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ChatBoteo - AI Chatbot Application powered by Puter.ai">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ChatBoteo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ChatBoteo - AI Chatbot</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Puter.js Library -->
  <script src="https://js.puter.ai/v1/puter.js"></script>
  
  <!-- Loading spinner -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #171717;
    }
    .flutter-loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 4px solid #10A37F;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="flutter-loader"></div>
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Puter.js Bridge for Flutter with callback -->
  <script>
    // Store callback for async response
    window.puterChatCallback = null;
    window.puterChatTimeout = null;
    
    // Sync function that initiates the async call
    window.puterChat = function(message, history) {
      console.log('Puter.js chat called');
      
      // Build messages array
      const messages = [];
      messages.push({
        role: 'system',
        content: 'You are ChatBoteo, a helpful AI assistant. Be concise.'
      });
      
      // Add history
      if (history && Array.isArray(history)) {
        for (let i = 0; i < history.length; i++) {
          const msg = history[i];
          if (msg && msg.content) {
            messages.push({
              role: msg.isUser ? 'user' : 'assistant',
              content: msg.content
            });
          }
        }
      }
      
      // Add current message
      messages.push({ role: 'user', content: message });
      
      // Use fetch to call puter.ai API directly (more reliable)
      const apiUrl = 'https://api.puter.ai/v1/chat/completions';
      
      // Create a promise-like response using async/await wrapped in a Promise
      return new Promise(function(resolve, reject) {
        // Check if puter is available
        if (typeof puter !== 'undefined' && puter.ai && puter.ai.chat) {
          puter.ai.chat(messages).then(function(response) {
            if (response && response.text) {
              resolve(response.text);
            } else if (typeof response === 'string') {
              resolve(response);
            } else {
              resolve('I received an unexpected response format.');
            }
          }).catch(function(err) {
            console.error('Puter.ai error:', err);
            resolve('Error: ' + err.message);
          });
        } else {
          // Fallback: try using fetch directly with anonymous app
          fetch(apiUrl, {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer anonymous'
            },
            body: JSON.stringify({
              model: 'default',
              messages: messages,
              max_tokens: 500
            })
          })
          .then(function(response) { return response.json(); })
          .then(function(data) {
            if (data.choices && data.choices[0] && data.choices[0].message) {
              resolve(data.choices[0].message.content);
            } else if (data.text) {
              resolve(data.text);
            } else {
              resolve('I apologize, but I could not generate a response. Please try again.');
            }
          })
          .catch(function(err) {
            console.error('API Error:', err);
            resolve('I encountered an error connecting to the AI service. The fallback responses will be used.');
          });
        }
      });
    };
    
    // Initialize puter on load
    window.addEventListener('load', function() {
      setTimeout(function() {
        if (typeof puter !== 'undefined') {
          console.log('Puter.js loaded');
        }
      }, 1500);
    });
  </script>
</body>
</html>
