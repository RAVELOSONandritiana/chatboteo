<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="ChatBoteo - AI Chatbot Application powered by Puter.ai">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="ChatBoteo">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>ChatBoteo - AI Chatbot</title>
  <link rel="manifest" href="manifest.json">
  
  <!-- Puter.js Library -->
  <script src="https://js.puter.ai/v1/puter.js"></script>
  
  <!-- Loading spinner -->
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #171717;
    }
    .flutter-loader {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 50px;
      height: 50px;
      border: 4px solid #10A37F;
      border-top-color: transparent;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: translate(-50%, -50%) rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="flutter-loader"></div>
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Puter.js Bridge for Flutter -->
  <script>
    // Global async function to handle chat with Puter.js
    window.puterChat = async function(message, history) {
      console.log('Puter.js chat called with message:', message);
      
      try {
        // Check if puter is available
        if (typeof puter === 'undefined') {
          console.error('Puter.js not loaded');
          return 'Error: Puter.js library not loaded. Please refresh the page.';
        }

        // Build conversation context
        const messages = [];
        
        // Add system prompt
        messages.push({
          role: 'system',
          content: 'You are ChatBoteo, a helpful and friendly AI assistant. Be concise and helpful.'
        });
        
        // Add history messages if available
        if (history && Array.isArray(history)) {
          for (let i = 0; i < history.length; i++) {
            const msg = history[i];
            if (msg && msg.content) {
              messages.push({
                role: msg.isUser ? 'user' : 'assistant',
                content: msg.content
              });
            }
          }
        }
        
        // Add current user message
        messages.push({
          role: 'user',
          content: message
        });
        
        console.log('Sending to Puter.ai with messages:', messages.length);
        
        // Call Puter.js AI using the chat method
        const response = await puter.ai.chat(messages);
        
        console.log('Puter.js response:', response);
        
        if (response && response.text) {
          return response.text;
        } else if (typeof response === 'string') {
          return response;
        } else {
          console.error('Unexpected response format:', response);
          return 'I received an unexpected response. Please try again.';
        }
        
      } catch (error) {
        console.error('Puter.js Error:', error);
        return 'I apologize, but I encountered an error: ' + error.message + '. Please try again.';
      }
    };
    
    // Check if Puter.js loaded successfully
    window.addEventListener('load', function() {
      setTimeout(function() {
        if (typeof puter !== 'undefined') {
          console.log('Puter.js loaded successfully');
          // Initialize puter with default settings
          puter.setAIEndpoint('https://api.puter.ai');
        } else {
          console.warn('Puter.js failed to load');
        }
      }, 1000);
    });
  </script>
</body>
</html>
